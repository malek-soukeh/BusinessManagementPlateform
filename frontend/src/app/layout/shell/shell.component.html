<ng-container *ngIf="{ handset: (isHandset$ | async) ?? false, profile: profile$ | async } as vm">
  <mat-sidenav-container class="shell" [autosize]="true">
    <mat-sidenav
      #drawer
      class="sidenav"
      [class.collapsed]="collapsed && !vm.handset"
      [mode]="vm.handset ? 'over' : 'side'"
      [opened]="!vm.handset"
      [fixedInViewport]="true"
    >
      <div class="brand">
        <span class="logo" aria-hidden="true"><mat-icon>bolt</mat-icon></span>
        <span class="brand-name">TechDistrib</span>
      </div>

      <nav class="nav" aria-label="Navigation principale">
        <div class="nav-group" *ngFor="let group of navGroups">
          <p class="nav-group-label" *ngIf="group.label">{{ group.label }}</p>
          <ng-container *ngFor="let item of group.items">
            <a
              *ngIf="!item.comingSoon; else soon"
              class="nav-item"
              [routerLink]="item.route"
              routerLinkActive="active"
              [matTooltip]="item.label"
              matTooltipPosition="right"
              [matTooltipDisabled]="!collapsed || vm.handset"
              (click)="closeIfOver(drawer)"
            >
              <mat-icon class="nav-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
              <span class="nav-label">{{ item.label }}</span>
            </a>
            <ng-template #soon>
              <span class="nav-item nav-soon" aria-disabled="true">
                <mat-icon class="nav-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
                <span class="nav-label">{{ item.label }}</span>
              </span>
            </ng-template>
          </ng-container>
        </div>
      </nav>

      <button
        *ngIf="!vm.handset"
        type="button"
        class="collapse-button"
        [attr.aria-label]="collapsed ? 'Déplier le menu' : 'Réduire le menu'"
        [attr.aria-expanded]="!collapsed"
        [matTooltip]="collapsed ? 'Déplier le menu' : ''"
        matTooltipPosition="right"
        (click)="toggleCollapsed()"
      >
        <mat-icon aria-hidden="true">{{ collapsed ? 'keyboard_double_arrow_right' : 'keyboard_double_arrow_left' }}</mat-icon>
        <span class="collapse-label">Réduire le menu</span>
      </button>
    </mat-sidenav>

    <mat-sidenav-content>
      <header class="app-topbar">
        <button
          *ngIf="vm.handset"
          mat-icon-button
          type="button"
          aria-label="Ouvrir le menu"
          (click)="drawer.toggle()"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <span class="topbar-brand" *ngIf="vm.handset">TechDistrib</span>
        <span class="spacer"></span>

        <button
          id="theme-button"
          mat-icon-button
          type="button"
          [attr.aria-label]="theme.isDark ? 'Activer le mode clair' : 'Activer le mode sombre'"
          [matTooltip]="theme.isDark ? 'Mode clair' : 'Mode sombre'"
          (click)="theme.toggle()"
        >
          <mat-icon>{{ theme.isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>

        <button
          id="user-menu-button"
          type="button"
          class="user-button"
          [matMenuTriggerFor]="userMenu"
          aria-label="Menu du compte"
        >
          <span class="avatar" aria-hidden="true">
            <ng-container *ngIf="vm.profile; else genericAvatar">{{ initials(vm.profile) }}</ng-container>
            <ng-template #genericAvatar><mat-icon>person</mat-icon></ng-template>
          </span>
          <span class="user" *ngIf="vm.profile as profile">
            <span class="user-name">{{ profile.firstName }} {{ profile.lastName }}</span>
            <span class="user-role">{{ roleLabels[profile.role] }}</span>
          </span>
          <mat-icon class="chevron" aria-hidden="true">expand_more</mat-icon>
        </button>

        <mat-menu #userMenu="matMenu" xPosition="before">
          <div class="menu-header" *ngIf="vm.profile as profile">
            <span class="menu-name">{{ profile.firstName }} {{ profile.lastName }}</span>
            <span class="menu-email">{{ profile.email }}</span>
          </div>
          <a mat-menu-item id="profile-link" routerLink="/profile">
            <mat-icon>account_circle</mat-icon>
            <span>Mon profil</span>
          </a>
          <button mat-menu-item id="logout-button" type="button" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Se déconnecter</span>
          </button>
        </mat-menu>
      </header>

      <main class="content" [@routeFade]="routeKey(outlet)" [@.disabled]="reducedMotion">
        <router-outlet #outlet="outlet"></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-container>
