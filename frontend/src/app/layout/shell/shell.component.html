<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false"
    [fixedInViewport]="true"
  >
    <div class="brand">
      <mat-icon>business_center</mat-icon>
      <span>TechDistrib</span>
    </div>

    <mat-nav-list>
      <ng-container *ngFor="let item of navItems">
        <a
          *ngIf="!item.comingSoon; else soon"
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="drawer.mode === 'over' && drawer.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle class="nav-label">{{ item.label }}</span>
        </a>

        <ng-template #soon>
          <a mat-list-item class="nav-soon" aria-disabled="true">
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle class="nav-label">{{ item.label }}</span>
            <span matListItemLine class="soon-tag">bientôt</span>
          </a>
        </ng-template>
      </ng-container>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <button
        *ngIf="isHandset$ | async"
        mat-icon-button
        type="button"
        aria-label="Ouvrir le menu"
        (click)="drawer.toggle()"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <span class="title">Business Management Platform</span>
      <span class="spacer"></span>

      <button
        id="theme-button"
        mat-icon-button
        type="button"
        [attr.aria-label]="theme.isDark ? 'Activer le mode clair' : 'Activer le mode sombre'"
        [matTooltip]="theme.isDark ? 'Mode clair' : 'Mode sombre'"
        (click)="theme.toggle()"
      >
        <mat-icon>{{ theme.isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <ng-container *ngIf="{ profile: profile$ | async } as vm">
        <button
          id="user-menu-button"
          mat-button
          type="button"
          class="user-button"
          [matMenuTriggerFor]="userMenu"
          aria-label="Menu du compte"
        >
          <span class="avatar" aria-hidden="true">
            <ng-container *ngIf="vm.profile; else genericAvatar">{{ initials(vm.profile) }}</ng-container>
            <ng-template #genericAvatar><mat-icon>person</mat-icon></ng-template>
          </span>
          <span class="user" *ngIf="vm.profile as profile">
            <span class="user-name">{{ profile.firstName }} {{ profile.lastName }}</span>
            <span class="user-role">{{ roleLabels[profile.role] }}</span>
          </span>
          <mat-icon class="chevron" aria-hidden="true">expand_more</mat-icon>
        </button>

        <mat-menu #userMenu="matMenu" xPosition="before">
          <div class="menu-header" *ngIf="vm.profile as profile">
            <span class="menu-name">{{ profile.firstName }} {{ profile.lastName }}</span>
            <span class="menu-email">{{ profile.email }}</span>
          </div>
          <a mat-menu-item id="profile-link" routerLink="/profile">
            <mat-icon>account_circle</mat-icon>
            <span>Mon profil</span>
          </a>
          <button mat-menu-item id="logout-button" type="button" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Se déconnecter</span>
          </button>
        </mat-menu>
      </ng-container>
    </mat-toolbar>

    <main class="content" [@routeFade]="routeKey(outlet)" [@.disabled]="reducedMotion">
      <router-outlet #outlet="outlet"></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
