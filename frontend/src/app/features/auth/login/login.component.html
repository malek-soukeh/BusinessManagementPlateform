<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Business Management Platform</mat-card-title>
      <mat-card-subtitle>Connectez-vous pour continuer</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
          <mat-error *ngIf="form.controls.email.hasError('required')">L'email est obligatoire</mat-error>
          <mat-error *ngIf="form.controls.email.hasError('email')">Format d'email invalide</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Mot de passe</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="hidePassword ? 'Afficher le mot de passe' : 'Masquer le mot de passe'"
          >
            <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.controls.password.hasError('required')">Le mot de passe est obligatoire</mat-error>
        </mat-form-field>

        <p class="error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

        <button mat-flat-button color="primary" type="submit" class="submit" [disabled]="loading">
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
          <span *ngIf="!loading">Se connecter</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
