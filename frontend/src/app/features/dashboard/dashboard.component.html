<div class="page">
  <mat-card *ngIf="profile$ | async as profile; else loading">
    <mat-card-header>
      <mat-card-title>Bonjour {{ profile.firstName }} {{ profile.lastName }}</mat-card-title>
      <mat-card-subtitle>{{ profile.role }} · {{ profile.email }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>Connexion réussie. Le menu et le tableau de bord arrivent aux prochaines étapes.</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-stroked-button color="primary" (click)="logout()">Se déconnecter</button>
    </mat-card-actions>
  </mat-card>

  <ng-template #loading>
    <mat-spinner diameter="32"></mat-spinner>
  </ng-template>
</div>
